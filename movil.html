<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de Mercado</title>
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mercado">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="sim.js"></script>
<script src="unlock.js"></script>
<style>
:root {
  color-scheme: light;
  --page: #f4f4f1; --surface: #fcfcfb; --surface-2: #f0efec;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --up: #006300; --down: #c22f2f; --up-mark: #0ca30c; --down-mark: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --div-pos: 42,120,214; --div-neg: 227,73,72;
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --up: #2fbf4a; --down: #e66767; --up-mark: #0ca30c; --down-mark: #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --div-pos: 57,135,229; --div-neg: 230,103,103;
    --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --up: #2fbf4a; --down: #e66767; --up-mark: #0ca30c; --down-mark: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --div-pos: 57,135,229; --div-neg: 230,103,103;
  --accent: #3987e5;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain;
  padding-bottom: calc(66px + env(safe-area-inset-bottom));
}
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; }

/* cabecera */
header.top {
  position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top);
  background: color-mix(in srgb, var(--page) 90%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.top-inner { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
.brand { font-size: 17px; font-weight: 680; letter-spacing: -.01em; }
#mkt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { min-width: 0; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2);
  padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--good); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(12,163,12,.6); } 70% { box-shadow: 0 0 0 7px rgba(12,163,12,0); } 100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); } }
.spacer { flex: 1; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  display: inline-grid; place-items: center; cursor: pointer; color: var(--ink-2); padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.meta { font-size: 11.5px; color: var(--muted); padding: 0 16px 8px; font-variant-numeric: tabular-nums; }
.meta.stale { color: var(--down); font-weight: 600; }

/* barra de pestañas */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding-bottom: env(safe-area-inset-bottom);
  background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
}
nav.tabs button { border: 0; background: none; padding: 8px 0 7px; display: grid; justify-items: center; gap: 2px;
  font-size: 10.5px; color: var(--muted); cursor: pointer; }
nav.tabs svg { width: 23px; height: 23px; }
nav.tabs button.on { color: var(--accent); font-weight: 600; }

main { padding: 12px 16px 24px; max-width: 720px; margin: 0 auto; }
h2.vt { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 2px; }
.vsub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; min-width: 0; }
.card h3 { margin: 0; font-size: 15.5px; font-weight: 640; display: flex; align-items: center; gap: 6px; }
.card .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
.chart-box { position: relative; height: 230px; }
.chart-box.short { height: 180px; }
.chart-box.tall { height: 290px; }
.note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
.callout { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }

/* botón de definición */
.info { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1px solid var(--axis); background: transparent;
  color: var(--muted); font: italic 600 11.5px/1 Georgia, serif; display: inline-grid; place-items: center; cursor: pointer; padding: 0; }
.info::before { content: ""; position: absolute; width: 40px; height: 40px; }
.info { position: relative; }

/* selectores segmentados con scroll horizontal */
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px 10px; padding: 0 14px; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 6px 13px; font-size: 13px; cursor: pointer; min-height: 34px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
.chips button { border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 6px 13px; font-size: 13px; cursor: pointer; min-height: 34px; }
.seg button.on { background: var(--ink); color: var(--page); border-color: var(--ink); font-weight: 600; }
main > .seg { margin: 0 -16px 12px; padding: 0 16px; }
select.sel, input.sel { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); min-height: 40px; width: 100%; }

/* resumen */
.summary { margin: 0; padding: 0; list-style: none; }
.summary li { padding: 9px 0 9px 20px; border-bottom: 1px solid var(--grid); position: relative; font-size: 14px; color: var(--ink-2); }
.summary li:last-child { border-bottom: 0; padding-bottom: 2px; }
.summary li::before { content: ""; position: absolute; left: 2px; top: 16px; width: 9px; height: 9px; border-radius: 3px; background: var(--c, var(--s1)); }
.summary b { color: var(--ink); font-weight: 620; }

/* régimen */
.regime-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.gauge-val { font-size: 28px; font-weight: 720; letter-spacing: -.02em; }
.gauge-bar { height: 10px; border-radius: 6px; margin: 10px 0 5px; position: relative;
  background: linear-gradient(90deg, var(--critical), var(--serious) 30%, var(--warning) 50%, var(--good) 80%); }
.gauge-bar i { position: absolute; top: -5px; width: 5px; height: 20px; border-radius: 3px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.gauge-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.counts { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.badge b { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px 6px; min-width: 0;
  text-align: left; cursor: pointer; width: 100%; }
.kpi:active, .row:active { transform: scale(.985); }
.kpi .k-name { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 4px; white-space: nowrap; overflow: hidden; }
.kpi .k-name span:last-child { color: var(--muted); font-size: 11px; }
.kpi .k-val { font-size: 19px; font-weight: 660; letter-spacing: -.01em; margin-top: 1px; font-variant-numeric: tabular-nums; }
.kpi .k-chg { font-size: 12.5px; font-weight: 580; font-variant-numeric: tabular-nums; }
.kpi svg { display: block; width: 100%; height: 30px; margin-top: 3px; }
.kgroup { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }

/* cartera resumida */
.pmini { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
.pmini .big { font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pmini .chev { color: var(--muted); font-size: 22px; }

/* señales */
details.sig { border: 1px solid var(--border); border-left-width: 4px; border-radius: 12px; background: var(--surface); margin-bottom: 8px; }
details.sig.good { border-left-color: var(--good); } details.sig.warning { border-left-color: var(--warning); }
details.sig.serious { border-left-color: var(--serious); } details.sig.critical { border-left-color: var(--critical); }
details.sig summary { list-style: none; padding: 11px 12px; cursor: pointer; }
details.sig summary::-webkit-details-marker { display: none; }
.sig-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sig-name { font-weight: 620; font-size: 14px; }
.sig-val { font-variant-numeric: tabular-nums; font-size: 13.5px; font-weight: 620; text-align: right; }
.sig-txt { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.sig-more { padding: 0 12px 12px; font-size: 13px; color: var(--ink-2); }
.sig-more p { margin: 0; background: var(--surface-2); padding: 9px 11px; border-radius: 9px; }
.sig-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.sig-foot .hint { font-size: 11.5px; color: var(--muted); }
details.sig[open] .hint { visibility: hidden; }
.sig-group { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 16px 0 8px; font-weight: 600; }

/* listas tocables */
.list { margin: 0 -14px -14px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 0; border-top: 1px solid var(--grid); background: none; padding: 11px 14px; min-height: 54px; cursor: pointer; }
.row .l { min-width: 0; }
.row .l b { font-weight: 640; font-size: 14.5px; }
.row .l small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .r { text-align: right; font-variant-numeric: tabular-nums; flex: none; }
.row .r b { font-weight: 620; font-size: 14.5px; display: block; }
.row .r small { font-size: 12.5px; font-weight: 560; }
.row .chev { color: var(--axis); font-size: 18px; margin-left: -2px; }
.mini-tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.mini-tbl th { color: var(--muted); font-weight: 560; font-size: 11.5px; text-align: right; padding: 4px 4px 6px; }
.mini-tbl td { text-align: right; padding: 8px 4px; border-top: 1px solid var(--grid); }
.mini-tbl th:first-child, .mini-tbl td:first-child { text-align: left; }

/* estadísticas */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 11px 12px; min-width: 0; }
.stat .l { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 4px; align-items: center; }
.stat .v { font-size: 20px; font-weight: 680; letter-spacing: -.01em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 12px; color: var(--muted); }
.stat.wide { grid-column: 1 / -1; }

/* barras horizontales */
.hbars { display: grid; gap: 9px; }
.hbar { display: grid; grid-template-columns: 112px 1fr 50px; align-items: center; gap: 8px; font-size: 13px; }
.hbar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; display: block; }
.hbar .fill { height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; display: block; }
.hbar .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cbar { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 8px; font-size: 13px; }
.cbar .track { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; }
.cbar .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.cbar .fill { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.cbar .num { text-align: right; font-variant-numeric: tabular-nums; }
.range52 { position: relative; height: 8px; border-radius: 4px; background: var(--grid); margin: 8px 0 4px; }
.range52 i { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--ink); }
.r52lab { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* proyección */
.ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
.ctrl label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
.outcomes { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-top: 12px; }
.outcomes > div { background: var(--surface-2); border-radius: 12px; padding: 9px 10px; min-width: 0; }
.outcomes .l { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 2px; }
.outcomes .v { font-size: 17px; font-weight: 680; font-variant-numeric: tabular-nums; }
.goal { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13.5px; color: var(--ink-2); }
.goal b { font-size: 18px; color: var(--ink); }
.pbar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
details.more { margin-top: 4px; }
details.more summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 560; padding: 6px 0; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }

/* hoja inferior */
#sheetBg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.42); opacity: 0; pointer-events: none; transition: opacity .2s; }
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--page); border-radius: 20px 20px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-width: 720px; margin: 0 auto; }
#sheet.on { transform: none; } #sheetBg.on { opacity: 1; pointer-events: auto; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--axis); margin: 2px auto 10px; }
.sh-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sh-head h3 { margin: 0; font-size: 19px; font-weight: 700; }
.sh-head small { color: var(--muted); font-size: 13px; }
.sh-price { font-size: 30px; font-weight: 720; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 6px; }
.sh-text { font-size: 14.5px; color: var(--ink-2); line-height: 1.55; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin-top: 10px; }
.kv > div { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 8px 10px; min-width: 0; }
.kv .l { font-size: 11px; color: var(--muted); }
.kv .v { font-size: 14.5px; font-weight: 640; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sh-sec { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 18px 0 2px; font-weight: 600; }
.close { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--ink-2); font-size: 18px; cursor: pointer; flex: none; }

.loading { padding: 80px 10px; text-align: center; color: var(--muted); }
footer { color: var(--muted); font-size: 12px; margin-top: 18px; line-height: 1.5; }
@media (min-width: 560px) { .kpis { grid-template-columns: repeat(3, minmax(0,1fr)); } }
/* teléfono girado / tablet: usa el ancho disponible */
@media (orientation: landscape) and (min-width: 640px) {
  main, #sheet { max-width: 1180px; }
  main { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  .stats { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .kpis { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .chart-box { height: 260px; } .chart-box.tall { height: 320px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  nav.tabs button { grid-auto-flow: column; align-items: center; gap: 6px; padding: 5px 0 4px; font-size: 12px; }
  nav.tabs svg { width: 19px; height: 19px; }
  #sheet { max-height: 94vh; }
  .chart-box, .chart-box.tall { height: 240px; }
}
/* noticias */
.news { display: block; text-decoration: none; color: inherit; border-top: 1px solid var(--grid); padding: 11px 14px; }
.news:first-child { border-top: 0; }
.news .tt { font-size: 14.5px; font-weight: 580; line-height: 1.35; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.news .sm { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news.full .sm { -webkit-line-clamp: 6; }
.news .mt { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.tk { font-size: 11px; font-weight: 650; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); }
.tk.mkt { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.lang { font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 0 4px; }
.nlist { margin: 0 -14px -14px; }
.ndot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 4px; vertical-align: middle; }
/* tabla de posiciones */
.ptbl-wrap { overflow-x: auto; margin: 0 -14px -14px; -webkit-overflow-scrolling: touch; }
table.ptbl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
table.ptbl th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-weight: 560; font-size: 11.5px;
  text-align: right; padding: 8px 9px; border-bottom: 1px solid var(--axis); white-space: nowrap; cursor: pointer; user-select: none; }
table.ptbl th.on { color: var(--ink); }
table.ptbl td { text-align: right; padding: 9px 9px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.ptbl th:first-child, table.ptbl td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; background: var(--surface);
  box-shadow: 1px 0 0 var(--grid); }
table.ptbl th:first-child { z-index: 2; }
table.ptbl td:first-child b { display: block; font-weight: 640; }

function fmtPrice(s, v) {
  if (v == null) return '—';
  const g = q(s).group;
  if (g === 'tasa') return nf(v, 3) + '%';
  if (s === 'CLP=X') return nf(v, 1);
  if (s.endsWith('=X')) return nf(v, 4);
  if (v > 10000) return nf(v, 0);
  return nf(v, 2);
}

function rangeStart(r, dates = D.dates) {
  const n = dates.length;
  const back = { '1D': 1, '5D': 5, '1M': 21, '3M': 63, '6M': 126, '1A': 252, '2A': n };
  if (r === 'YTD') {
    const y = dates[n - 1].slice(0, 4);
    const i = dates.findIndex(d => d.startsWith(y));
    return Math.max(0, i - 1);
  }
  return Math.max(0, n - 1 - (back[r] || n));
}
function rebase(arr) {
  const b = arr.find(v => v != null);
  return arr.map(v => v == null || !b ? null : v / b * 100);
}
function segHTML(key, opts) {

    return `<button data-v="${v}" class="${S[key] === v ? 'on' : ''}">${l}</button>`;
  }).join('') + '</div>';
}

const crosshair = {
  id: 'crosshair',
  afterDatasetsDraw(c) {
    const a = c.tooltip && c.tooltip.getActiveElements();
    if (!a || !a.length || c.config.type !== 'line') return;
    const x = a[0].element.x, { top, bottom } = c.chartArea, ctx = c.ctx;
    ctx.save(); ctx.strokeStyle = css('--axis'); ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke(); ctx.restore();
  }
};
const refLine = {
  id: 'refLine',
  beforeDatasetsDraw(c, _, o) {
    if (o.y == null) return;
    const y = c.scales.y.getPixelForValue(o.y), { left, right, top, bottom } = c.chartArea, ctx = c.ctx;
    if (y < top || y > bottom) return;
    ctx.save(); ctx.strokeStyle = css('--axis'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke(); ctx.restore();
  }
};
function baseOpts({ yFmt = v => nf(v, 1), tipFmt, ref = null, min, max, legend = true, xTicks = 4 } = {}) {
  const ink2 = css('--ink-2'), muted = css('--muted'), grid = css('--grid');
  return {
    responsive: true, maintainAspectRatio: false, animation: { duration: 200 },
    interaction: { mode: 'index', intersect: false },
    layout: { padding: { top: 2 } },

      tooltip: {

        padding: 9, boxWidth: 8, boxHeight: 8, usePointStyle: true, titleFont: { size: 12 }, bodyFont: { size: 12 },
        callbacks: { label: c => ` ${c.dataset.label}: ${(tipFmt || yFmt)(c.parsed.y)}` }
      },
      refLine: { y: ref }
    },
    scales: {
      x: { grid: { display: false }, border: { color: css('--axis') },
        ticks: { color: muted, maxTicksLimit: xTicks, maxRotation: 0, font: { size: 10.5 } } },

}

function draw(id, cfg) {

const shortDate = d => { const [y, m, dd] = d.split('-'); return `${dd}-${m}-${y.slice(2)}`; };

function spark(s, invert) {
  const it = D.intraday[s];
  let vals, base;
  if (it && it.c.length > 3) { vals = it.c; base = it.prev; }
  else { vals = D.series[s] ? D.series[s].slice(-30) : []; base = vals[0]; }
  vals = vals.filter(v => v != null);
  if (vals.length < 2) return '<svg></svg>';
  const all = base != null ? vals.concat([base]) : vals;
  const mn = Math.min(...all), mx = Math.max(...all), W = 160, H = 30, pad = 3;
  const x = i => i / (vals.length - 1) * W, y = v => mx === mn ? H / 2 : pad + (1 - (v - mn) / (mx - mn)) * (H - 2 * pad);
  const last = vals[vals.length - 1], up = base == null ? last >= vals[0] : last >= base;
  const col = (invert ? !up : up) ? 'var(--up-mark)' : 'var(--down-mark)';
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const bl = base != null ? `<line x1="0" x2="${W}" y1="${y(base)}" y2="${y(base)}" stroke="var(--axis)" stroke-dasharray="2 3" stroke-width="1"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bl}<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

function header() {
  const old = Date.now() / 1000 - D.epoch > Math.max(600, D.refreshSeconds * 4);
  const open = D.marketStatus.startsWith('Abierto') && !old;
  $('#dot').className = 'dot' + (open ? ' live' : '');
  $('#mkt').textContent = old ? 'Sin actualizar' : 'NYSE · ' + D.marketStatus;
  updMeta();
}
function updMeta() {
  if (!D) return;
  const age = Math.round(Date.now() / 1000 - D.epoch);
  const el = $('#upd');
  // en la nube: cada 15 min con el mercado abierto y cada 2 h fuera de él, así que el umbral depende del horario
  const cloud = D.host === 'nube', open = /^Abierto/.test(D.marketStatus || '');
  const stale = age > (cloud ? (open ? 45 * 60 : 160 * 60) : Math.max(600, D.refreshSeconds * 4));
  el.className = 'meta' + (stale ? ' stale' : '');
  const ago = age < 120 ? age + ' s' : age < 7200 ? Math.round(age / 60) + ' min' : age < 172800 ? Math.round(age / 3600) + ' h' : Math.round(age / 86400) + ' días';
  el.textContent = `Datos del ${D.generatedLocal.slice(0, 16)} · hace ${ago}` + (stale ? (cloud ? ' · la nube no se ha actualizado (revisa GitHub Actions)' : ' · el PC no está actualizando') : '');
}

function regime() {
  const STATE = { good: 1, warning: 0, serious: -1, critical: -2 };
  const sig = D.signals, score = sig.reduce((a, s) => a + STATE[s.state], 0) / sig.length;
  const pos = Math.round((score + 2) / 3 * 100);
  return { pos, label: pos >= 72 ? 'Risk-on' : pos >= 58 ? 'Neutral' : pos >= 42 ? 'Cautela' : 'Risk-off' };
}
const STATE_L = { good: 'Favorable', warning: 'Atención', serious: 'Riesgo', critical: 'Crítico' };

  const semi = p.holdings.filter(h => h.sector === 'Semiconductores').reduce((a, h) => a + h.weight * h.er, 0);
  const top = [...p.holdings].sort((a, b) => b.weight * (b.er - (spx ? spx.mu : 0)) - a.weight * (a.er - (spx ? spx.mu : 0))).slice(0, 4);
  out.push(li(`El retorno extra depende de <b>${top.map(h => h.sym).join(', ')}</b>; semiconductores aportan ${pct(semi / p.mu, 0, false)} del retorno esperado.`, 'var(--s2)'));
  const fin = R.pct[S.projScen][H][2], inv = D.portfolio.totals.mv + ap * 12 * H;
  if (ap > 0) out.push(li(`En la mediana, <b>${pct(Math.min(1, inv / fin), 0, false)}</b> del valor final serán tus propios aportes: subir el aporte pesa más que ganarle al índice por 1–2 pp.`, 'var(--s4)'));
  if (need != null) {
    const ok = Object.entries(sc).filter(([, s]) => s.mu >= need).map(([, s]) => s.name);
    out.push(li(`Meta ${usdK(meta)}: requiere <b>${pct(need, 1, false)}</b> anual. ${ok.length ? 'Alcanzable en la mediana con: ' + ok.join(', ') + '.' : 'Ningún escenario lo logra en la mediana: sube el aporte o el plazo.'}`, 'var(--s5)'));
  }
  return out;
}

/* ------------------------------------------------------------------ dibujar la vista activa */
function drawView() {
  const dates = D.dates.map(shortDate);
  const sl = (arr, r) => arr.slice(rangeStart(r));
  const IT = D.intraday['^GSPC'], iT = IT ? IT.t : [];
  const isD = r => r === '1D' && !!IT;
  const lab = r => isD(r) ? iT : sl(dates, r);
  const intra = s => {
    const it = D.intraday[s];
    if (!it) return iT.map(() => null);
    const m = Object.fromEntries(it.t.map((t, i) => [t, it.c[i]]));
    return iT.map(t => m[t] ?? null);
  };
  const ser = (s, r) => isD(r) ? intra(s) : sl(D.series[s], r);
  const reb = (s, r) => {
    if (!isD(r)) return rebase(sl(D.series[s], r));
    const p = (D.intraday[s] || {}).prev;
    return intra(s).map(v => v == null || !p ? null : v / p * 100);
  };

  if (S.tab === 'mercado') {
    if (S.mk === 'indices') {
      const idx = [['^GSPC', 'S&P 500'], ['^IXIC', 'Nasdaq'], ['^DJI', 'Dow'], ['^RUT', 'Russell'], ['RSP', 'S&P igual pond.']];
      draw('cPerf', { type: 'line', data: { labels: lab(S.perf), datasets: idx.map(([s, n], i) => lineDS(n, reb(s, S.perf), sc(i))) },
        options: baseOpts({ yFmt: v => nf(v, 0), tipFmt: v => pct((v - 100) / 100, 1), ref: 100 }) });
      if (IT) draw('cIntra', { type: 'line', data: { labels: IT.t, datasets: [lineDS('S&P 500', IT.c, IT.c[IT.c.length - 1] >= IT.prev ? css('--up-mark') : css('--down-mark'))] },
        options: baseOpts({ yFmt: v => nf(v, 0), ref: IT.prev, legend: false }) });
    }
    if (S.mk === 'tasas') {
      const rs = [['^IRX', '3M'], ['^FVX', '5Y'], ['^TNX', '10Y'], ['^TYX', '30Y']];
      draw('cRates', { type: 'line', data: { labels: lab(S.rates), datasets: rs.map(([s, n], i) => lineDS(n, ser(s, S.rates), sc(i))) },
        options: baseOpts({ yFmt: v => nf(v, 2) + '%' }) });
      const n = D.dates.length, at = (s, b) => D.series[s][Math.max(0, n - 1 - b)];
      const mats = [['3M', '^IRX'], ['5Y', '^FVX'], ['10Y', '^TNX'], ['30Y', '^TYX']];
      draw('cCurve', { type: 'line', data: { labels: mats.map(m => m[0]), datasets: [
          lineDS('Hoy', mats.map(m => at(m[1], 0)), sc(0), { pointRadius: 4 }),
          lineDS('Hace 1 mes', mats.map(m => at(m[1], 21)), sc(1), { pointRadius: 3 }),
          lineDS('Hace 1 año', mats.map(m => at(m[1], 252)), sc(2), { pointRadius: 3 })] },
        options: baseOpts({ yFmt: v => nf(v, 2) + '%' }) });
      const slope = D.series['^TNX'].map((v, i) => v == null || D.series['^IRX'][i] == null ? null : (v - D.series['^IRX'][i]) * 100);
      draw('cSlope', { type: 'line', data: { labels: dates, datasets: [lineDS('10Y − 3M', slope, sc(0), { fill: { target: { value: 0 }, above: 'rgba(12,163,12,.10)', below: 'rgba(208,59,59,.14)' } })] },
        options: baseOpts({ yFmt: v => nf(v, 0) + ' pb', ref: 0, legend: false }) });
      if (D.fred.DFII10 && D.fred.T10YIE) {
        const f1 = D.fred.DFII10, f2 = D.fred.T10YIE, map2 = Object.fromEntries(f2.dates.map((d, i) => [d, f2.values[i]]));
        draw('cReal', { type: 'line', data: { labels: f1.dates.map(shortDate), datasets: [lineDS('Tasa real 10Y', f1.values, sc(0)), lineDS('Inflación implícita', f1.dates.map(d => map2[d] ?? null), sc(1))] },

          options: baseOpts({ yFmt: v => nf(v, 0) + ' pb', ref: 0, legend: false }) });
      }
    }
    if (S.mk === 'credito') {
      if (D.fredOk) {

        const gm = g ? Object.fromEntries(g.dates.map((d, i) => [d, g.values[i]])) : {};

        if (isD(S.credit)) {

        }

          lineDS('20 días', sl(r.c20, S.corr), sc(2), { borderWidth: 1.25 }), lineDS('60 días', sl(r.c60, S.corr), sc(0)), lineDS('120 días', sl(r.c120, S.corr), sc(1))] },
        options: baseOpts({ yFmt: v => nf(v, 1), tipFmt: v => nf(v, 2), ref: 0, min: -1, max: 1 }) });
      const en = [['XLE', 'Energía'], ['XLK', 'Tecnología'], ['SMH', 'Semis'], ['CL=F', 'WTI']];
      draw('cEnergy', { type: 'line', data: { labels: lab(S.energy), datasets: en.map(([s, nn], i) => lineDS(nn, reb(s, S.energy), sc(i))) },
        options: baseOpts({ yFmt: v => nf(v, 0), tipFmt: v => pct((v - 100) / 100, 1), ref: 100 }) });
    }
    if (S.mk === 'sectores') {
      const secs = D.sectors.filter(s => D.quotes[s]).map(s => [q(s).name, q(s)[S.sector]]).sort((a, b) => b[1] - a[1]);
      const so = baseOpts({ yFmt: v => v, legend: false });
      so.indexAxis = 'y'; so.interaction = { mode: 'nearest', intersect: true, axis: 'y' };
      so.scales = { x: { position: 'top', grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--muted'), callback: v => nf(v * 100, 0) + '%', font: { size: 10.5 }, maxTicksLimit: 5 } },
                    y: { grid: { display: false }, border: { color: css('--axis') }, ticks: { color: css('--ink-2'), font: { size: 12 } } } };
      so.plugins.tooltip.callbacks = { label: c => ' ' + pct(c.parsed.x) };
      so.plugins.refLine = {};
      draw('cSector', { type: 'bar', data: { labels: secs.map(s => s[0]), datasets: [{ data: secs.map(s => s[1]),
          backgroundColor: secs.map(s => s[1] >= 0 ? css('--up-mark') : css('--down-mark')), borderRadius: 4, borderSkipped: false, barThickness: 16 }] }, options: so });
    }
  }

  if (S.tab === 'cartera')
    draw('cPort', { type: 'line', data: { labels: lab(S.port), datasets: [lineDS(PF().name, rebase(sl(PF().value, S.port)), sc(0)), lineDS('S&P 500', rebase(sl(D.series['^GSPC'], S.port)), sc(1)),
      ...(S.pf !== '0' ? [lineDS('Mi cartera', rebase(sl(D.portfolio.value, S.port)), css('--muted'), { borderDash: [4, 4], borderWidth: 1.5 })] : [])] },
      options: baseOpts({ yFmt: v => nf(v, 0), tipFmt: v => pct((v - 100) / 100, 1), ref: 100 }) });

  if (S.tab === 'cartera' && S.cv === 'sim' && simRes && simRes.A && simRes.B) {
    const sv = r => rebase(sl(r.V, S.simR));
    draw('cSim', { type: 'line', data: { labels: lab(S.simR), datasets: [lineDS('Simulada', sv(simRes.B), sc(0)), lineDS('Actual', sv(simRes.A), css('--muted'), { borderDash: [4, 4], borderWidth: 1.5 }), lineDS('S&P 500', rebase(sl(D.series['^GSPC'], S.simR)), sc(1))] },
      options: baseOpts({ yFmt: v => nf(v, 0), tipFmt: v => pct((v - 100) / 100, 1), ref: 100 }) });
  }

  if (S.tab === 'proy' && D.portfolio.proj) {
    const H = +S.projH, ap = +S.projAporte, R = simulate(H, ap, +S.projMeta), scn = projScenarios(), k = S.projScen;
    const c = sc_(k), P = R.pct[k], col = i => P.map(r => r[i]);
    const band = (label, i, fill, a) => lineDS(label, col(i), c, { borderWidth: 0, pointHoverRadius: 0, fill: fill ? '-1' : false, backgroundColor: rgba(c, a) });
    const ds = [band('P90', 4, false), band('P10', 0, true, .12), band('P75', 3, false), band('P25', 1, true, .22),

    Object.keys(scn).filter(x => x !== k).forEach(x => ds.push(lineDS(scn[x].name, R.pct[x].map(r => r[2]), sc_(x), { borderDash: [5, 4], borderWidth: 1.5 })));
    ds.push(lineDS('Aportado', P.map((_, y) => D.portfolio.totals.mv + ap * 12 * y), css('--muted'), { borderDash: [2, 3], borderWidth: 1.5 }));
    const po = baseOpts({ yFmt: usdK, tipFmt: v => usdK(v), ref: +S.projMeta || null, xTicks: 6 });
    po.plugins.legend.labels.filter = it => !/^P\d/.test(it.text);
    po.plugins.tooltip.filter = it => !/^P(75|25)$/.test(it.dataset.label);
    if (S.projLog === '1') po.scales.y.type = 'logarithmic';
    draw('cProj', { type: 'line', data: { labels: P.map((_, y) => y ? 'Año ' + y : 'Hoy'), datasets: ds }, options: po });
  }
}

/* ------------------------------------------------------------------ eventos */
document.addEventListener('click', e => {
  const info = e.target.closest('[data-info]');
  if (info) { e.stopPropagation(); e.preventDefault(); infoSheet(info.dataset.info); return; }
  if (e.target.closest('[data-close]') || e.target.id === 'sheetBg') { closeSheet(); return; }
  const t = e.target.closest('#tabs button');
  if (t) { closeSheet(); S.tab = t.dataset.tab; try { localStorage.setItem('movil-tab', S.tab); } catch (_) {} render(false); return; }
  const b = e.target.closest('.seg button');
  if (b) {
    const key = b.parentElement.dataset.key;
    S[key] = b.dataset.v;
    if (key === 'aRange') { b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); drawAsset(); return; }
    render(key !== 'mk');
    return;
  }
  if (e.target.closest('[data-nall]')) { S.nall = !S.nall; render(); return; }
  const sk = e.target.closest('[data-sortk]');
  if (sk) { S.sort = sk.dataset.sortk; render(); return; }
  const cv = e.target.closest('[data-cv]');
  if (cv) { S.cv = cv.dataset.cv; render(false); return; }
  const sd = e.target.closest('[data-simdel]');
  if (sd) { delete S.sim[sd.dataset.simdel]; render(); return; }
  const sa = e.target.closest('[data-simact]');
  if (sa) { const k = sa.dataset.simact;
    if (k === 'reset') simInit(true);
    else S.sim = k === 'equal' ? SimCore.equalize(S.sim) : k === 'small' ? SimCore.dropSmall(S.sim, 0.02) : SimCore.capWeight(S.sim, 0.10);
    render(); return; }
  if (e.target.id === 'simAddBtn') { const s = $('#simAddSel').value, v = Math.max(0, +$('#simAddAmt').value || 0); if (s && v) { S.sim[s] = (S.sim[s] || 0) + v; render(); } return; }
  if (e.target.id === 'lockBtn') { e.preventDefault(); PanelUnlock.forget(); return; }
  const a = e.target.closest('[data-asset]');
  if (a) { assetSheet(a.dataset.asset); return; }
  const g = e.target.closest('[data-goto]');
  if (g) { S.tab = g.dataset.goto; try { localStorage.setItem('movil-tab', S.tab); } catch (_) {} render(false); }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'corrSel') { S.corrPair = e.target.value; render(); }
  if (id === 'corrSym') { S.corrSym = e.target.value; render(); }
  if (e.target.classList.contains('simAmt')) { S.sim[e.target.dataset.sym] = Math.max(0, +e.target.value || 0); render(); }
  if (id === 'projAporte' || id === 'projMeta') {
    S[id] = String(Math.max(0, +e.target.value || 0));
    try { localStorage.setItem('panel-proj', JSON.stringify({ a: S.projAporte, m: S.projMeta })); } catch (_) {}
    render();
  }
});

$('#themeBtn').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('panel-theme', r.dataset.theme); } catch (_) {}
  render(); if (sheetMode === 'asset') assetSheet(S.aSym);
});
try { const t = localStorage.getItem('panel-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) render(); });

/* recarga de data.js */
let timer = 0;
function reload() {
  clearTimeout(timer);
  $('#refBtn').classList.add('spin');
  const s = document.createElement('script');
  s.src = 'data.js?t=' + Date.now();
  const done = () => { s.remove(); $('#refBtn').classList.remove('spin'); schedule(); };
  s.onload = async () => {
    try { await PanelUnlock.ready(); } catch (err) { done(); $('#app').innerHTML = `<div class="loading">${esc(err.message)}</div>`; return; }
    render(); if (sheetMode === 'asset') assetSheet(S.aSym); done();
  };
  s.onerror = () => { done(); if (!D) $('#app').innerHTML = location.protocol === 'https:' ? '<div class="loading">No se pudieron cargar los datos.<br><br>Revisa tu conexión a internet e inténtalo de nuevo.</div>' : '<div class="loading">No hay conexión con el computador.<br><br>Verifica que <b>Iniciar_Panel_Movil (.command en Mac / .bat en Windows)</b> esté corriendo y que el teléfono esté en la misma red WiFi.</div>'; };
  document.body.appendChild(s);
}
function schedule() {
  const sec = (window.PANEL_DATA && window.PANEL_DATA.refreshSeconds) || 120;
  nextAt = Date.now() + sec * 1000;
  timer = setTimeout(reload, sec * 1000);
}
$('#refBtn').addEventListener('click', reload);
// al volver a la app, actualizar de inmediato
document.addEventListener('visibilitychange', () => { if (!document.hidden && D && Date.now() / 1000 - D.epoch > 60) reload(); });
setInterval(updMeta, 1000);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  navigator.serviceWorker.register('sw.js').catch(() => {});
reload();
</script>
