<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Mercado</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="sim.js"></script>
<script src="unlock.js"></script>
<style>
:root {
  color-scheme: light;
  --page: #f4f4f1; --surface: #fcfcfb; --surface-2: #f0efec;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --up: #006300; --down: #c22f2f; --up-mark: #0ca30c; --down-mark: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --div-pos: 42,120,214; --div-neg: 227,73,72; --div-mid: 240,239,236;
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --up: #2fbf4a; --down: #e66767; --up-mark: #0ca30c; --down-mark: #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --div-pos: 57,135,229; --div-neg: 230,103,103; --div-mid: 56,56,53;
    --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --up: #2fbf4a; --down: #e66767; --up-mark: #0ca30c; --down-mark: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --div-pos: 57,135,229; --div-neg: 230,103,103; --div-mid: 56,56,53;
  --accent: #3987e5;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1480px; margin: 0 auto; padding: 0 24px 48px; }
header.top {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
}
.top-inner { max-width: 1480px; margin: 0 auto; padding: 14px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2);
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--good); box-shadow: 0 0 0 0 rgba(12,163,12,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(12,163,12,0); } 100% { box-shadow: 0 0 0 0 rgba(12,163,12,0); } }
.spacer { flex: 1; }
.meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta.stale { color: var(--down); font-weight: 600; }
nav.jump { display: flex; gap: 4px; flex-wrap: wrap; }
nav.jump a { font-size: 12.5px; color: var(--ink-2); text-decoration: none; padding: 4px 9px; border-radius: 6px; }
nav.jump a:hover { background: var(--surface-2); color: var(--ink); }
button { font: inherit; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; }
.btn:hover { color: var(--ink); }
.tape { margin: 0 auto; max-width: 1480px; padding: 0 24px; }

section { margin-top: 34px; }
.sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.sec-head h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
.sec-head p { margin: 0; color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g-wide { grid-template-columns: 2fr 1fr; }
@media (max-width: 1100px) { .g2, .g3, .g-wide { grid-template-columns: minmax(0,1fr); } }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 14.5px; font-weight: 620; }
.card .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.chart-box { position: relative; height: 300px; }
.chart-box.tall { height: 360px; }
.chart-box.short { height: 230px; }

.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--ink-2); padding: 4px 9px; font-size: 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
input.num { width: 92px; font: inherit; font-size: 12.5px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); text-align: right; }
select.sel { font: inherit; font-size: 12.5px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; margin-top: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px 8px; min-width: 0; }
.kpi .k-name { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 6px; }
.kpi .k-name span:last-child { color: var(--muted); font-size: 11px; }
.kpi .k-val { font-size: 21px; font-weight: 620; letter-spacing: -.01em; margin-top: 2px; }
.kpi .k-chg { font-size: 12.5px; font-weight: 560; font-variant-numeric: tabular-nums; }
.kpi svg { display: block; width: 100%; height: 34px; margin-top: 4px; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }

/* signals */
.regime { display: grid; grid-template-columns: 300px 1fr; gap: 14px; }
@media (max-width: 900px) { .regime { grid-template-columns: 1fr; } }
.gauge-val { font-size: 34px; font-weight: 650; letter-spacing: -.02em; }
.gauge-bar { height: 10px; border-radius: 6px; margin: 12px 0 6px; position: relative;
  background: linear-gradient(90deg, var(--critical), var(--serious) 30%, var(--warning) 50%, var(--good) 80%); }
.gauge-bar i { position: absolute; top: -5px; width: 4px; height: 20px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.gauge-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.counts { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.sig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.sig { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface); border-left-width: 4px; }
.sig.good { border-left-color: var(--good); } .sig.warning { border-left-color: var(--warning); }
.sig.serious { border-left-color: var(--serious); } .sig.critical { border-left-color: var(--critical); }
.sig-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.sig-name { font-weight: 600; font-size: 13px; }
.sig-val { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; white-space: nowrap; }
.sig-txt { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); margin-top: 6px; }
.badge b { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.sig-group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.t th { text-align: right; font-weight: 560; color: var(--muted); font-size: 11.5px; padding: 7px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; cursor: pointer; user-select: none; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.t tr:hover td { background: var(--surface-2); }
table.t th.sorted { color: var(--ink); }
.sym { font-weight: 620; } .nm { color: var(--muted); font-size: 12px; margin-left: 6px; }
.wbar { display: inline-block; height: 6px; border-radius: 3px; background: var(--s1); vertical-align: middle; margin-right: 6px; }
.range52 { position: relative; display: inline-block; width: 90px; height: 6px; border-radius: 3px; background: var(--grid); vertical-align: middle; }
.range52 i { position: absolute; top: -3px; width: 3px; height: 12px; border-radius: 2px; background: var(--ink-2); }

/* heatmap */
table.hm { border-collapse: separate; border-spacing: 2px; font-size: 11.5px; font-variant-numeric: tabular-nums; width: 100%; }
table.hm td, table.hm th { padding: 6px 4px; text-align: center; border-radius: 4px; }
table.hm th { color: var(--muted); font-weight: 560; white-space: nowrap; }
table.hm th.row { text-align: right; padding-right: 8px; }
table.hm td { cursor: default; }

.stat-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.stat .l { font-size: 12px; color: var(--ink-2); }
.stat .v { font-size: 22px; font-weight: 640; letter-spacing: -.01em; margin-top: 2px; }
.stat .d { font-size: 12px; color: var(--muted); }
.insights { margin: 0; padding: 0; list-style: none; }
.insights li { padding: 9px 0 9px 22px; border-bottom: 1px solid var(--grid); position: relative; font-size: 13px; color: var(--ink-2); }
.insights li:last-child { border-bottom: 0; }
.insights li::before { content: ""; position: absolute; left: 4px; top: 15px; width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--s1)); }
.insights b { color: var(--ink); font-weight: 600; }
.hbars { display: grid; gap: 7px; }
.hbar { display: grid; grid-template-columns: 150px 1fr 56px; align-items: center; gap: 10px; font-size: 12.5px; }
.hbar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
.hbar .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.callout { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
footer { margin-top: 40px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); padding-top: 16px; }
.loading { padding: 80px 0; text-align: center; color: var(--muted); }

/* globos de definición */
[data-tip] { cursor: help; text-decoration: underline dotted var(--axis); text-decoration-thickness: 1px; text-underline-offset: 3px; }
#tipbox { position: fixed; z-index: 50; max-width: 300px; padding: 8px 10px; border-radius: 8px;
  background: var(--surface); color: var(--ink-2); border: 1px solid var(--axis); box-shadow: 0 4px 16px rgba(0,0,0,.12);
  font-size: 12.5px; line-height: 1.45; font-weight: 400; text-transform: none; letter-spacing: 0; text-align: left;
  white-space: normal; pointer-events: none; opacity: 0; transition: opacity .12s; }
#tipbox.on { opacity: 1; }

/* zoom de la proyección */
.zoom-wrap { display: grid; grid-template-columns: minmax(0,1fr) 52px; gap: 8px; align-items: stretch; }
.vzoom { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); text-align: center; padding: 30px 0 26px; }
.vzoom input { writing-mode: vertical-lr; direction: rtl; flex: 1; width: 22px; margin: 0; accent-color: var(--accent); cursor: ns-resize; }
.hzoom { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.hzoom input[type=range] { width: 130px; accent-color: var(--accent); cursor: ew-resize; }
.hzoom b { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; min-width: 92px; }
@media (max-width: 640px) {
  .wrap, .top-inner, .tape { padding-left: 16px; padding-right: 16px; }
  nav.jump { display: none; }
  .hbar { grid-template-columns: 110px 1fr 50px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">Panel de Mercado <small>Estados Unidos</small></div>
    <span class="status"><span class="dot" id="dot"></span><span id="mkt">—</span></span>
    <nav class="jump">
      <a href="#senales">Señales</a><a href="#indices">Índices</a><a href="#tasas">Tasas</a>
      <a href="#credito">Crédito y volatilidad</a><a href="#energia">Energía vs tech</a>
      <a href="#correlaciones">Correlaciones</a><a href="#monitor">Monitor</a><a href="#cartera">Mi cartera</a><a href="#analisis">Análisis</a><a href="#simulador">Simulador</a><a href="#proyeccion">Proyección</a>
    </nav>
    <span class="spacer"></span>
    <span class="meta" id="upd">Cargando…</span>
    <button class="btn" id="themeBtn" title="Cambiar tema">Tema</button>
  </div>
</header>

<div class="tape" id="tape"></div>

<main class="wrap">
  <div id="app"><div class="loading">Cargando datos… Si esto no cambia, ejecuta <b>Iniciar_Panel (.command en Mac / .bat en Windows)</b> para generar <code>data.js</code>.</div></div>
</main>

<script>
/* ------------------------------------------------------------------ util */
const $ = (s, el = document) => el.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const sc = i => css(SERIES[i]);
let D = null, charts = {}, nextAt = 0;
const S = { perf: '6M', rates: '1A', credit: '1A', vix: '6M', corrPair: 'XLE_XLK', corr: '1A', energy: '6M',
            sector: 'chgPct', matrix: '60d', monitor: 'indice', port: '1A', pf: '0', comp: null, sim: null, simBase: null, simR: '1A', sort: { k: 'mv', d: -1 },
            projH: '20', projScen: 'port', projAporte: '100', projMeta: '50000',
            projY: 100, projX0: 0, projX1: null, projLog: '0', projHidden: new Set() };
try { const p = JSON.parse(localStorage.getItem('panel-proj') || '{}'); if (p.a) S.projAporte = p.a; if (p.m) S.projMeta = p.m; } catch (_) {}

const nf = (v, d = 2) => v == null ? '—' : v.toLocaleString('es-CL', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 2, sign = true) => v == null ? '—' : (sign && v > 0 ? '+' : '') + nf(v * 100, d) + '%';
const usd = (v, d = 2) => v == null ? '—' : (v < 0 ? '−' : '') + 'US$' + nf(Math.abs(v), d);
const dir = v => v == null || v === 0 ? 'flat' : v > 0 ? 'up' : 'down';
const arrow = v => v == null || v === 0 ? '' : v > 0 ? '▲ ' : '▼ ';
const q = s => D.quotes[s] || {};
// carteras: 0 = la propia (Excel); el resto viene de carteras.json
const PFS = () => [{ ...D.portfolio, name: 'Mi cartera', source: 'Excel', note: '' }, ...(D.others || [])];
const PF = () => PFS()[+S.pf] || PFS()[0];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ------------------------------------------------------------------ definiciones (globos al pasar el mouse) */
const TIPS = {
  // KPIs (por símbolo)
  '^GSPC': 'S&P 500: las 500 mayores empresas de EE.UU. Es la referencia del mercado en general. YTD = variación en lo que va del año.',
  '^IXIC': 'Nasdaq Composite: índice cargado a tecnología y empresas de crecimiento. Más volátil que el S&P.',
  '^DJI': 'Dow Jones: 30 empresas grandes, con sesgo industrial y "valor". Menos sensible a tecnología.',
  '^RUT': 'Russell 2000: empresas pequeñas. Refleja la economía doméstica y es sensible al crédito y a las tasas.',
  '^VIX': 'VIX: volatilidad esperada del S&P a 30 días ("índice del miedo"). Se lee invertido: si baja, es verde. Bajo 15 = calma · 20–30 = tensión · sobre 30 = pánico.',
  '^IRX': 'Tesoro 3 meses: sigue de cerca la tasa de la Fed. El cambio se mide en pb (1 pb = 0,01 punto porcentual).',
  '^FVX': 'Tesoro 5 años: tramo medio de la curva, el más sensible a lo que se espera de la Fed.',
  '^TNX': 'Tesoro 10 años: tasa de referencia para hipotecas y para valorar acciones. Si sube rápido, sufren tecnología, REITs y utilities.',
  '^TYX': 'Tesoro 30 años: refleja inflación y riesgo fiscal de largo plazo.',
  'HY': 'Spread High Yield: rendimiento extra de los bonos basura sobre el Tesoro. Bajo 3% = complacencia · 3–4,5% = normal · sobre 5% = estrés. Sin FRED API key se muestra el ETF HYG como sustituto (si HYG cae, el spread se amplía).',
  'CL=F': 'Petróleo WTI: crudo de referencia en EE.UU. Alzas fuertes presionan inflación y márgenes.',
  'BZ=F': 'Brent: crudo de referencia internacional. Suele cotizar sobre el WTI.',
  'GC=F': 'Oro: activo refugio. Sufre cuando suben las tasas reales o el dólar, porque no paga intereses.',
  'DX-Y.NYB': 'Índice dólar (DXY): dólar contra 6 monedas. Un dólar fuerte presiona a commodities y emergentes.',
  'CLP=X': 'USD/CLP: pesos chilenos por dólar. Sube cuando el dólar global se fortalece o cae el cobre.',
  'BTC-USD': 'Bitcoin: termómetro de liquidez y apetito especulativo.',
  // señales (por nombre)
  'regime': 'Promedio de las señales: Favorable +1, Atención 0, Riesgo −1, Crítico −2, llevado a escala 0–100. 72+ Risk-on · 58–71 Neutral · 42–57 Cautela · bajo 42 Risk-off. Es un termómetro del entorno, no una señal de compra/venta.',
  'VIX': 'Nivel de miedo en el mercado de acciones. Bajo 15 = calma · 20–30 = tensión · sobre 30 = pánico.',
  'Estructura VIX (VIX/VIX3M)': 'VIX ÷ VIX 3 meses. Sobre 1 (backwardation) = el miedo de corto plazo supera al de 3 meses: estrés agudo. Bajo 1 (contango) = normal.',
  'MOVE (vol. bonos)': 'Volatilidad implícita de los bonos del Tesoro (el "VIX de las tasas"). Sobre ~90 presiona las valoraciones de empresas de crecimiento.',
  'Spread High Yield (OAS)': 'Rendimiento extra del high yield sobre el Tesoro. Bajo 3% = complacencia · 3–4,5% = normal · sobre 5% = estrés. Importa más la velocidad del alza que el nivel.',
  'Crédito (proxy HYG/IEF, 1M)': 'Bonos high yield (HYG) vs Tesoro 7–10 años (IEF) en el último mes. Si cae, el crédito rinde peor que el Tesoro: los spreads se amplían. El crédito suele anticipar a las acciones.',
  'Curva 10Y - 3M': 'Tasa 10 años menos tasa 3 meses. Positiva = sana. Negativa (invertida) = el mercado de bonos descuenta recesión.',
  'Curva 10Y - 2Y': 'Tasa 10 años menos tasa 2 años. Positiva = sana. Negativa (invertida) = el mercado de bonos descuenta recesión.',
  'Tasa real 10Y': 'Rendimiento del bono indexado a inflación (TIPS). Tasas reales altas presionan a tecnología y oro.',
  'Tesoro 10Y (cambio 1M)': 'Cambio de la tasa 10Y en el último mes. Alzas rápidas golpean acciones de larga duración (tech, REITs, utilities); bajas las ayudan.',
  'S&P 500 vs medias móviles': 'Posición vs la media de 50 (MM50) y 200 días (MM200). Sobre ambas = alcista · entre ambas = corrección dentro de tendencia alcista · bajo ambas = bajista.',
  'S&P 500 desde máximo 52s': 'Distancia al máximo del último año. −10% = corrección · −20% = mercado bajista.',
  'Amplitud sectorial': 'Cuántos de los 12 sectores están sobre su media de 50 días. Más sectores = subida sana y amplia.',

const tipBox = document.createElement('div');

let tipT = 0, tipEl = null;
const hideTip = () => { clearTimeout(tipT); tipBox.classList.remove('on'); tipEl = null; };
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (el === tipEl) return;
  hideTip(); tipEl = el;
  if (!el) return;
  tipT = setTimeout(() => {
    tipBox.textContent = el.dataset.tip;
    tipBox.style.left = '0px'; tipBox.style.top = '0px'; tipBox.classList.add('on');
    const r = el.getBoundingClientRect(), w = tipBox.offsetWidth, h = tipBox.offsetHeight;
    let y = r.bottom + 6;
    if (y + h > innerHeight - 8) y = r.top - h - 6;
    tipBox.style.left = Math.min(Math.max(8, r.left), innerWidth - w - 8) + 'px';
    tipBox.style.top = y + 'px';
  }, 300);
});

function fmtPrice(s, v) {
  if (v == null) return '—';
  const g = q(s).group;
  if (g === 'tasa') return nf(v, 3) + '%';
  if (s === 'CLP=X') return nf(v, 1);
  if (s.endsWith('=X')) return nf(v, 4);
  if (v > 10000) return nf(v, 0);
  return nf(v, 2);
}

function rangeStart(r, dates = D.dates) {
  const n = dates.length;
  const back = { '1D': 1, '5D': 5, '1M': 21, '3M': 63, '6M': 126, '1A': 252, '2A': n };
  if (r === 'YTD') {
    const y = dates[n - 1].slice(0, 4);
    const i = dates.findIndex(d => d.startsWith(y));
    return Math.max(0, i - 1);
  }
  return Math.max(0, n - 1 - (back[r] || n));
}
function rebase(arr) {
  const b = arr.find(v => v != null);
  return arr.map(v => v == null || !b ? null : v / b * 100);
}

const crosshair = {
  id: 'crosshair',
  afterDatasetsDraw(c) {
    const a = c.tooltip && c.tooltip.getActiveElements();
    if (!a || !a.length || c.config.type !== 'line') return;
    const x = a[0].element.x, { top, bottom } = c.chartArea, ctx = c.ctx;
    ctx.save(); ctx.strokeStyle = css('--axis'); ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke(); ctx.restore();

const refLine = {
  id: 'refLine',

    const y = c.scales.y.getPixelForValue(o.y), { left, right, top, bottom } = c.chartArea, ctx = c.ctx;
    if (y < top || y > bottom) return;
    ctx.save(); ctx.strokeStyle = css('--axis'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke(); ctx.restore();
  }
};

/* ------------------------------------------------------------------ sparkline */
function spark(s, invert) {
  const it = D.intraday[s];
  let vals, base;
  if (it && it.c.length > 3) { vals = it.c; base = it.prev; }
  else { vals = D.series[s] ? D.series[s].slice(-30) : []; base = vals[0]; }
  vals = vals.filter(v => v != null);
  if (vals.length < 2) return '<svg></svg>';
  const all = base != null ? vals.concat([base]) : vals;
  const mn = Math.min(...all), mx = Math.max(...all), W = 160, H = 34, pad = 3;
  const x = i => i / (vals.length - 1) * W, y = v => mx === mn ? H / 2 : pad + (1 - (v - mn) / (mx - mn)) * (H - 2 * pad);
  const last = vals[vals.length - 1], up = base == null ? last >= vals[0] : last >= base;
  const good = invert ? !up : up;
  const col = good ? 'var(--up-mark)' : 'var(--down-mark)';
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const bl = base != null ? `<line x1="0" x2="${W}" y1="${y(base)}" y2="${y(base)}" stroke="var(--axis)" stroke-dasharray="2 3" stroke-width="1"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bl}<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

function updMeta() {
  if (!D) return;
  const age = Math.round(Date.now() / 1000 - D.epoch);
  const left = Math.max(0, Math.round((nextAt - Date.now()) / 1000));
  const el = $('#upd');
  const stale = age > Math.max(600, D.refreshSeconds * 4);
  el.className = 'meta' + (stale ? ' stale' : '');
  el.title = 'Datos generados: ' + D.generatedLocal;
  el.textContent = `Datos ${D.generatedLocal.slice(-8)} · hace ${age < 120 ? age + ' s' : Math.round(age / 60) + ' min'}` +
    (stale ? ' · desactualizado: ¿corre Iniciar_Panel (.command en Mac / .bat en Windows)?' : ` · próx. ${left} s`);
}

    if (s === 'HY') return hyTile();
    const x = q(s); if (x.price == null) return '';
    const chg = x.group === 'tasa' ? `${x.chgBp > 0 ? '+' : ''}${nf(x.chgBp, 1)} pb` : pct(x.chgPct);
    const cls = inv ? dir(-x.chgPct) : dir(x.chgPct);
    return `<div class="kpi">
      <div class="k-name"><span${ta(s)}>${name}</span><span>YTD ${pct(x.ytd, 1)}</span></div>
      <div class="k-val" title="${esc(x.name)} · ${x.time} NY">${fmtPrice(s, x.price)}</div>
      <div class="k-chg ${cls}">${arrow(x.chgPct)}${chg}</div>${spark(s, inv)}</div>`;
  }).join('') + `</div>`;
}
function hyTile() {
  const f = D.fred.BAMLH0A0HYM2;
  if (f) {
    const v = f.values, n = v.length, ch = (v[n - 1] - v[n - 2]) * 100, ch1m = (v[n - 1] - v[Math.max(0, n - 22)]) * 100;
    const pts = v.slice(-60), mn = Math.min(...pts), mx = Math.max(...pts);
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1) * 160).toFixed(1)},${(3 + (1 - (p - mn) / (mx - mn || 1)) * 28).toFixed(1)}`).join('');
    return `<div class="kpi" title="ICE BofA US High Yield Index Option-Adjusted Spread · FRED (${f.dates[n - 1]})">
      <div class="k-name"><span${ta('HY')}>HY OAS (ICE BofA)</span><span>1M ${ch1m > 0 ? '+' : ''}${nf(ch1m, 0)} pb</span></div>
      <div class="k-val">${nf(v[n - 1], 2)}%</div>
      <div class="k-chg ${dir(-ch)}">${arrow(ch)}${ch > 0 ? '+' : ''}${nf(ch, 0)} pb</div>
      <svg viewBox="0 0 160 34" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${ch1m > 0 ? 'var(--down-mark)' : 'var(--up-mark)'}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg></div>`;
  }
  const h = q('HYG');
  return `<div class="kpi" title="Sin acceso a FRED: se muestra HYG como proxy del spread High Yield. Agrega tu FRED API key en config.json.">
    <div class="k-name"><span${ta('HY')}>High Yield (HYG)*</span><span>YTD ${pct(h.ytd, 1)}</span></div>

}

const STATE = { good: ['Favorable', 1], warning: ['Atención', 0], serious: ['Riesgo', -1], critical: ['Crítico', -2] };
function signalsHTML() {
  const sig = D.signals;
  const score = sig.reduce((a, s) => a + STATE[s.state][1], 0) / sig.length; // -2..1
  const pos = Math.round((score + 2) / 3 * 100);
  const label = pos >= 72 ? 'Risk-on' : pos >= 58 ? 'Neutral' : pos >= 42 ? 'Cautela' : 'Risk-off';
  const counts = Object.keys(STATE).map(k => `<span class="badge"><b style="background:var(--${k})"></b>${STATE[k][0]}: ${sig.filter(s => s.state === k).length}</span>`).join('');
  const groups = [...new Set(sig.map(s => s.group))];
  return `<section id="senales"><div class="sec-head"><h2>Lectura del mercado</h2>
    <p>${sig.length} señales cuantitativas: riesgo, crédito, tasas, tendencia, ciclo y macro</p></div>

function corrHTML() {

  const nm = s => short[s] || s;

    const a = Math.min(1, Math.abs(v)), rgb = v >= 0 ? css('--div-pos') : css('--div-neg'), mid = css('--div-mid');
    const [r1, g1, b1] = mid.split(',').map(Number), [r2, g2, b2] = rgb.split(',').map(Number);

    const ink = a > .55 ? '#fff' : 'var(--ink)';
    return `<td style="background:${bg};color:${ink}" title="${nf(v, 2)}">${nf(v, 2)}</td>`;
  };

        </tbody></table></div>
        <p class="note">Impacto = beta × shock. Ej.: si el petróleo sube 10%, la cartera históricamente se movió lo indicado ese día. Relación estadística, no causal.</p></div>

}

function compareHTML(pfs) {
  // S&P 500 como referencia: mismos plazos, beta 1, su volatilidad y máxima caída de 1 año
  const spx = D.series['^GSPC'].slice(-252), spxDD = Math.min(...spx.map((v, i) => v / Math.max(...spx.slice(0, i + 1)) - 1));
  const H = [['r1m', '1M'], ['r3m', '3M'], ['r6m', '6M'], ['ytd', 'YTD'], ['r1y', '1A'], ['r2y', '2A']];
  const ref = pfs[0].perf || {};
  const cell = (v, b) => `<td class="${dir(v)}">${pct(v, 1)}${b != null && v != null ? ` <small style="color:var(--muted)">${v >= b ? '▲' : '▼'}</small>` : ''}</td>`;
  const row = (name, perf, beta, vol, dd, pl, on) => `<tr${on ? ' style="background:var(--surface-2, rgba(127,127,127,.08))"' : ''}><td><b>${esc(name)}</b></td>
    ${H.map(([k]) => cell(perf[k] && perf[k].port, ref[k] && ref[k].spx)).join('')}
    <td>${nf(beta, 2)}</td><td>${pct(vol, 1, false)}</td><td class="down">${pct(dd, 1)}</td><td class="${dir(pl)}">${pct(pl, 1)}</td></tr>`;
  return `<div class="card" style="margin-top:14px"><h3${ta('compare')}>Comparación de carteras vs S&P 500</h3>
    <p class="sub">Rendimiento simulado con las posiciones actuales de cada cartera · ▲/▼ = mejor o peor que el S&P en ese plazo</p>
    <div class="tbl-wrap"><table class="t"><thead><tr><th>Cartera</th>${H.map(([, l]) => `<th${ta('t_horizon')}>${l}</th>`).join('')}
      <th${ta('beta')}>Beta</th><th${ta('vol')}>Volatilidad</th><th${ta('dd')}>Máx. caída 1A</th><th${ta('t_plCost')}>Res. vs costo</th></tr></thead><tbody>
    ${pfs.map((p, i) => row(p.name, p.perf || {}, p.stats.beta, p.stats.vol, p.stats.maxDD, p.totals.plPct, String(i) === S.pf)).join('')}
    <tr><td style="color:var(--ink-2)"><b>S&P 500</b></td>${H.map(([k]) => `<td class="${dir(ref[k] && ref[k].spx)}">${pct(ref[k] && ref[k].spx, 1)}</td>`).join('')}
      <td>1,00</td><td>${pct(pfs[0].stats.spxVol, 1, false)}</td><td class="down">${pct(spxDD, 1)}</td><td style="color:var(--muted)">—</td></tr>
    </tbody></table></div>
    <p class="note">Cada cartera se valoriza hacia atrás como si siempre hubiera tenido sus posiciones de hoy: mide la calidad de la selección actual, no las decisiones pasadas de compra y venta.</p></div>`;
}

const bigUsd = (v, cur = 'USD') => v == null ? '—' : (cur === 'USD' ? 'US$' : cur + ' ') + (v >= 1e12 ? nf(v / 1e12, 2) + ' B' : v >= 1e9 ? nf(v / 1e9, 1) + ' mil M' : nf(v / 1e6, 0) + ' M');
const mult = v => v == null || v <= 0 ? '—' : nf(v, 1) + 'x';
// lectura de valuación vs pares: P/U forward y crecimiento de ingresos contra la mediana
function compRead(it) {
  const m = it.peerMed || {}, pe = it.fpe, mp = m.fpe;
  if (!pe || !mp || pe <= 0 || mp <= 0) return ['—', ''];
  const rel = pe / mp - 1, grows = it.revG != null && m.revG != null ? it.revG - m.revG : null;
  if (rel > 0.2) return grows != null && grows > 0.05 ? ['Más cara, pero crece más', 'flat'] : ['Más cara que sus pares', 'down'];
  if (rel < -0.2) return grows != null && grows < -0.05 ? ['Más barata, crece menos', 'flat'] : ['Más barata que sus pares', 'up'];
  return ['En línea con sus pares', 'flat'];
}

    <td>${pct(x.om, 1, false)}</td><td>${pct(x.roe, 1, false)}</td><td class="${dir(x.r1y)}">${pct(x.r1y, 1)}</td></tr>`;

  const A = R.assump;

        <div class="tbl-wrap"><table class="t"><thead><tr><th>Acción</th><th>Fecha</th><th>Cuándo</th><th${ta('t_epsEst')}>UPA esperada</th><th${ta('t_revEst')}>Ingresos esperados</th><th${ta('t_avgMove')}>Mov. típico</th><th${ta('t_weight')}>Peso</th></tr></thead>

/* ------------------------------------------------------------------ simulador de cambios en la cartera */
let simRes = null;
function simInit(force) {
  if (force || !S.sim || S.simBase !== S.pf) {
    S.sim = Object.fromEntries(PF().rows.map(r => [r.sym, Math.round(r.mv * 100) / 100]));
    S.simBase = S.pf;
  }
}
function simHTML() {
  if (!window.SimCore || !D.sim) return '';
  simInit(false);
  const P = PF(), mine = P === PFS()[0], cand = D.sim.cand, base = Object.fromEntries(P.rows.map(r => [r.sym, r.mv]));
  const A = SimCore.compute(D, base), B = SimCore.compute(D, S.sim);
  const X = B && SimCore.compute(D, { SPY: B.total });
  simRes = { A, B, X };
  if (!A || !B) return `<section id="simulador"><div class="sec-head"><h2>Simulador</h2><p>Agrega al menos una posición con monto mayor a cero.</p></div>${simControls(P, cand, base)}</section>`;
  // filas de métricas: [etiqueta, clave tip, f(res), formato, mejor si sube (1) / baja (-1) / neutro (0)]
  const M = [
    ['Valor total', 's_total', r => r.total, v => usd(v, 0), 0],
    ['Posiciones', 's_n', r => r.n, v => nf(v, 0), 0],
    ['Retorno esperado anual', 'mu', r => r.er, v => pct(v, 1, false), 1],
    ['Volatilidad anual', 'vol', r => r.vol, v => pct(v, 1, false), -1],
    ['Retorno por unidad de riesgo', 's_ratio', r => r.sharpeLike, v => nf(v, 2), 1],
    ['Beta vs S&P 500', 'beta', r => r.beta, v => nf(v, 2), 0],
    ['VaR 95% (1 día)', 'var', r => r.var95Usd, v => usd(v, 0), -1],
    ['Máx. caída 1 año', 'dd', r => r.maxDD, v => pct(v, 1), 1],
    ['Rendimiento 1 año', 's_r1y', r => r.r1y, v => pct(v, 1), 1],
    ['Rendimiento 2 años', 's_r2y', r => r.r2y, v => pct(v, 1), 1],
    ['Rendimiento en el año', 's_ytd', r => r.ytd, v => pct(v, 1), 1],
    ['Riesgo en las 3 mayores', 's_top3', r => r.top3, v => pct(v, 0, false), -1],
  ];
  const delta = (a, b, f, good) => { if (a == null || b == null) return '<td>—</td>'; const d = b - a;
    if (Math.abs(d) < 1e-9) return '<td style="color:var(--muted)">=</td>';
    const cls = good === 0 ? '' : (d > 0) === (good > 0) ? 'up' : 'down';
    return `<td class="${cls}">${d > 0 ? '▲' : '▼'} ${String(f(Math.abs(d))).replace(/^\+/, '')}</td>`; };
  const rows = M.map(([l, k, g, f, good]) => `<tr><td${ta(k)}>${l}</td><td>${f(g(A))}</td><td><b>${f(g(B))}</b></td>${delta(g(A), g(B), f, good)}<td style="color:var(--ink-2)">${X ? f(g(X)) : '—'}</td></tr>`).join('');
  const secs = [...new Set([...A.sectors, ...B.sectors].map(s => s[0]))];

  out.push(li(`Tecnología + semis + comunicaciones pesan <b>${pct(techW, 0, false)}</b> de la cartera pero explican <b>${pct(techR, 0, false)}</b> del riesgo (semis solos: ${pct(semiW, 0, false)} del peso, ${pct(semiR, 0, false)} del riesgo).${idx.length ? ` ${idx.join(', ')} agrega exposición tecnológica indirecta.` : ''}`, 'var(--s2)'));
  const top = [...rows].sort((a, b) => b.riskContrib - a.riskContrib).slice(0, 3);
  out.push(li(`Mayores fuentes de riesgo: ${top.map(r => `<b>${r.sym}</b> (${pct(r.riskContrib, 0, false)} del riesgo vs ${pct(r.weight, 0, false)} del peso)`).join(', ')}.`, 'var(--s2)'));
  const energyW = sum(r => r.sector === 'Energía', 'weight');
  const c60 = D.rolling.XLE_XLK.c60.filter(v => v != null).slice(-1)[0];
  if (energyW < 0.01) out.push(li(`Sin exposición directa a <b>energía</b>. La correlación energía-tecnología a 60 días es <b>${nf(c60, 2)}</b>${c60 < 0.3 ? ': históricamente un sector así diversifica una cartera cargada a tecnología.' : ': hoy la diversificación que aportaría es limitada.'}`, 'var(--s3)'));
  const fo = P.factors['Tasa 10Y'];
  const rateSens = rows.filter(r => ['Inmobiliario', 'Utilities'].includes(r.sector)).map(r => r.sym);
  if (fo) out.push(li(`Sensibilidad a tasas: con +10 pb en el 10Y la cartera se movió en promedio <b>${pct(fo.beta * 0.1, 2)}</b>.${rateSens.length ? ` Inmobiliario y utilities (${rateSens.join(', ')}) son las posiciones más sensibles a tasas.` : ' No tiene inmobiliario ni utilities, los sectores más sensibles a tasas.'}`, 'var(--s1)'));
  const below = rows.filter(r => r.vsMa200 != null && r.vsMa200 < 0);
  if (below.length) out.push(li(`<b>${below.length}</b> posiciones bajo su media de 200 días (tendencia bajista): ${below.map(r => `${r.sym} ${pct(r.vsMa200, 0)}`).join(', ')}.`, 'var(--s8)'));
  const os = rows.filter(r => r.rsi != null && r.rsi <= 30), ob = rows.filter(r => r.rsi != null && r.rsi >= 70);
  if (os.length) out.push(li(`Sobreventa (RSI ≤ 30): <b>${os.map(r => r.sym).join(', ')}</b>. Caídas extendidas en el corto plazo; útil para evaluar puntos de entrada si la tesis sigue intacta.`, 'var(--s3)'));
  if (ob.length) out.push(li(`Sobrecompra (RSI ≥ 70): <b>${ob.map(r => r.sym).join(', ')}</b>. Momentum fuerte; riesgo de toma de utilidades.`, 'var(--s4)'));
  const losers = rows.filter(r => r.plPct < -0.15);
  if (losers.length) out.push(li(`Pérdidas mayores al 15%: ${losers.map(r => `<b>${r.sym}</b> ${pct(r.plPct, 0)}`).join(', ')}. Revisa si la tesis original se mantiene.`, 'var(--s8)'));
  const st = P.stats;
  out.push(li(`Con un VaR 95% de <b>${usd(st.var95Usd, 0)}</b>, en 1 de cada 20 días la cartera podría perder más que eso. Hoy: ${usd(P.totals.today)}.`, 'var(--s7)'));
  return out;
}

/* proyección de largo plazo: Monte Carlo con retornos esperados desde utilidades proyectadas */
const SCEN_COLOR = { port: 0, SPY: 1, QQQ: 2 };
// el retorno esperado es incierto: cada simulación sortea un error común de mercado y uno propio de la selección
const ERR_MKT = 0.015, ERR_SEL = { port: 0.025, SPY: 0, QQQ: 0.015 };
let projCache = { key: '', res: null };
function rng(seed) {
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
const usdK = v => v == null ? '—' : 'US$' + (Math.abs(v) >= 1e6 ? nf(v / 1e6, 2) + ' M' : Math.abs(v) >= 1e4 ? nf(v / 1e3, 0) + ' k' : nf(v, 0));

function projScenarios() {
  const p = D.portfolio.proj, out = { port: { name: 'Mi cartera', mu: p.mu, sigma: p.sigma, hist: p.hist, rho: 1 } };
  for (const k of ['SPY', 'QQQ']) if (p.bench[k]) out[k] = { ...p.bench[k] };
  return out;
}
// valor futuro determinista con aporte mensual al final de cada mes
function fv(v0, ap, H, r) { const m = Math.pow(1 + r, 1 / 12) - 1, M = H * 12, g = Math.pow(1 + m, M); return v0 * g + (m ? ap * (g - 1) / m : ap * M); }
function requiredReturn(v0, ap, H, meta) {
  if (fv(v0, ap, H, -0.5) >= meta) return -0.5;
  let lo = -0.5, hi = 1;
  if (fv(v0, ap, H, hi) < meta) return null;
  for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; fv(v0, ap, H, mid) < meta ? lo = mid : hi = mid; }
  return (lo + hi) / 2;
}
function simulate(H, ap, meta) {
  const sc = projScenarios(), v0 = D.portfolio.totals.mv, keys = Object.keys(sc);
  const key = JSON.stringify([H, ap, meta, v0, sc]);
  if (projCache.key === key) return projCache.res;
  const N = 2000, M = H * 12, rand = rng(20261105);
  const gauss = () => { let u = 0; while (!u) u = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rand()); };
  // mediana de crecimiento = (1 + retorno esperado)^t; los benchmarks se simulan correlacionados con la cartera
  const par = keys.map(k => ({ k, s: sc[k].sigma / Math.sqrt(12), rho: Math.min(1, sc[k].rho ?? 1) }));
  const yr = Object.fromEntries(keys.map(k => [k, Array.from({ length: H + 1 }, () => new Float64Array(N))]));
  const hit = Object.fromEntries(keys.map(k => [k, 0]));
  let beat = 0;
  for (let n = 0; n < N; n++) {
    const v = par.map(() => v0), em = ERR_MKT * gauss();
    const dd = par.map(q2 => Math.log(1 + Math.max(-0.5, sc[q2.k].mu + em + (ERR_SEL[q2.k] || 0) * gauss())) / 12);
    par.forEach(q2 => { yr[q2.k][0][n] = v0; });
    for (let m = 1; m <= M; m++) {
      const z = gauss();
      for (let j = 0; j < par.length; j++) {
        const q2 = par[j], e = q2.rho >= 1 ? z : q2.rho * z + Math.sqrt(1 - q2.rho * q2.rho) * gauss();
        v[j] = v[j] * Math.exp(dd[j] + q2.s * e) + ap;
      }
      if (m % 12 === 0) par.forEach((q2, j) => { yr[q2.k][m / 12][n] = v[j]; });
    }
    par.forEach((q2, j) => { if (v[j] >= meta) hit[q2.k]++; });
    if (sc.SPY && v[0] > v[keys.indexOf('SPY')]) beat++;
  }
  const P = [0.1, 0.25, 0.5, 0.75, 0.9], res = { pct: {}, hit: {}, beat: sc.SPY ? beat / N : null };
  for (const k of keys) {
    res.pct[k] = yr[k].map(a => { const s = Float64Array.from(a).sort(); return P.map(p => s[Math.floor(p * (N - 1))]); });
    res.hit[k] = hit[k] / N;
  }
  projCache = { key, res };
  return res;
}

function projInsights(R, sc, rf, H, ap, meta, need) {
  const p = D.portfolio.proj, out = [], st = D.portfolio.stats;
  const li = (html, c = 'var(--s1)') => `<li style="--c:${c}">${html}</li>`;
  const me = sc.port, spx = sc.SPY;
  if (spx) {
    const d = me.mu - spx.mu, shMe = (me.mu - rf) / me.sigma, shSpx = (spx.mu - rf) / spx.sigma;
    out.push(li(`Retorno esperado: <b>${pct(me.mu, 1, false)}</b> anual vs <b>${pct(spx.mu, 1, false)}</b> del S&P 500 (${d >= 0 ? '+' : ''}${nf(d * 100, 1)} pp), con volatilidad ${pct(me.sigma, 0, false)} vs ${pct(spx.sigma, 0, false)}.`, sc_('port')));
    out.push(li(`Retorno por unidad de riesgo: <b>${nf(shMe, 2)}</b> vs <b>${nf(shSpx, 2)}</b> del S&P. ${shMe > shSpx * 1.1 ? 'Sobre el papel tu selección compensa el riesgo extra.' : shMe < shSpx * 0.9 ? 'El riesgo extra no está bien pagado: el índice es más eficiente.' : 'Prácticamente empatados: el riesgo extra apenas se paga.'}`, 'var(--s7)'));
    if (R.beat != null) out.push(li(`Probabilidad de terminar sobre el S&P 500 en ${H} años: <b>${pct(R.beat, 0, false)}</b>. Incluye el riesgo de que el consenso se equivoque (±${pct(ERR_SEL.port, 1, false)} anual en tu selección). Correlación entre ambos: ${nf(spx.rho, 2)}, así que la diferencia viene de pocas apuestas.`, sc_('SPY')));
    out.push(li(`Historial (simulado con posiciones actuales): 2 años <b>${pct(me.hist, 1)}</b> anual vs S&P <b>${pct(spx.hist, 1)}</b>; último año ${pct(st.r1y, 1)} vs ${pct(st.spx1y, 1)}. ${me.hist < spx.hist ? 'Hasta ahora el mercado ha ganado.' : 'Hasta ahora la selección ha agregado valor.'}`, me.hist < spx.hist ? 'var(--s8)' : 'var(--s3)'));
  }
  const semi = p.holdings.filter(h => h.sector === 'Semiconductores').reduce((a, h) => a + h.weight * h.er, 0);
  const top = [...p.holdings].sort((a, b) => b.weight * (b.er - (spx ? spx.mu : 0)) - a.weight * (a.er - (spx ? spx.mu : 0))).slice(0, 4);
  out.push(li(`El retorno extra depende de <b>${top.map(h => h.sym).join(', ')}</b>; semiconductores aportan ${pct(semi / p.mu, 0, false)} del retorno esperado. Si el consenso de IA no se cumple, la ventaja desaparece.`, 'var(--s2)'));
  const fin = R.pct[S.projScen][H][2], inv = D.portfolio.totals.mv + ap * 12 * H;
  if (ap > 0) out.push(li(`En la mediana, <b>${pct(Math.min(1, inv / fin), 0, false)}</b> del valor final serán tus propios aportes. Con una cartera de ${usdK(D.portfolio.totals.mv)}, subir el aporte mensual pesa más que ganarle al índice por 1–2 pp.`, 'var(--s4)'));
  if (need != null) {
    const ok = Object.entries(sc).filter(([, s]) => s.mu >= need).map(([, s]) => s.name);
    out.push(li(`Meta ${usdK(meta)}: requiere <b>${pct(need, 1, false)}</b> anual. ${ok.length ? 'Alcanzable en la mediana con: ' + ok.join(', ') + '.' : 'Ningún escenario lo logra en la mediana: sube el aporte o el plazo antes que el riesgo.'}`, 'var(--s5)'));
  }
  return out;
}

function footerHTML() {
  return `<footer>Fuentes: Yahoo Finance (precios; índices en tiempo real, futuros con hasta 10–15 min de retraso), FRED / ICE Data Indices (spreads de crédito y tasas reales).
    Señales y observaciones son cálculos cuantitativos con fines informativos y no constituyen recomendación de inversión.
    ${D.host === 'nube' ? `Los datos se calculan en la nube: cada 15 min en horario de mercado y cada 2 horas fuera de él. <a href="#" id="lockBtn">Cerrar sesión en este dispositivo</a>` : `Actualización automática cada ${D.refreshSeconds} s mientras <b>Iniciar_Panel (.command en Mac / .bat en Windows)</b> esté en ejecución.`}</footer>`;
}

/* ------------------------------------------------------------------ chart drawing */
function drawAll() {
  const dates = D.dates.map(shortDate);
  const sl = (arr, r) => arr.slice(rangeStart(r));
  // rango 1D: series intradía alineadas a las horas del S&P; base 100 = cierre anterior
  const IT = D.intraday['^GSPC'], iT = IT ? IT.t : [];
  const isD = r => r === '1D' && !!IT;
  const lab = r => isD(r) ? iT : sl(dates, r);
  const intra = s => {
    const it = D.intraday[s];
    if (!it) return iT.map(() => null);
    const m = Object.fromEntries(it.t.map((t, i) => [t, it.c[i]]));
    return iT.map(t => m[t] ?? null);
  };
  const ser = (s, r) => isD(r) ? intra(s) : sl(D.series[s], r);
  const reb = (s, r) => {
    if (!isD(r)) return rebase(sl(D.series[s], r));
    const p = (D.intraday[s] || {}).prev;
    return intra(s).map(v => v == null || !p ? null : v / p * 100);
  };

  // índices
  const idx = [['^GSPC', 'S&P 500'], ['^IXIC', 'Nasdaq'], ['^DJI', 'Dow Jones'], ['^RUT', 'Russell 2000'], ['RSP', 'S&P igual pond.']];
  draw('cPerf', { type: 'line', data: { labels: lab(S.perf), datasets: idx.map(([s, n], i) => lineDS(n, reb(s, S.perf), sc(i))) },
    options: baseOpts({ yFmt: v => nf(v, 0), tipFmt: v => nf(v - 100, 1) + '%', ref: 100 }) });

  const it = D.intraday['^GSPC'];
  if (it) draw('cIntra', { type: 'line', data: { labels: it.t, datasets: [lineDS('S&P 500', it.c, it.c[it.c.length - 1] >= it.prev ? css('--up-mark') : css('--down-mark'))] },
    options: baseOpts({ yFmt: v => nf(v, 0), ref: it.prev, legend: false, xTicks: 6 }) });

  // tasas
  const rs = [['^IRX', '3M'], ['^FVX', '5Y'], ['^TNX', '10Y'], ['^TYX', '30Y']];
  draw('cRates', { type: 'line', data: { labels: lab(S.rates), datasets: rs.map(([s, n], i) => lineDS(n, ser(s, S.rates), sc(i))) },
    options: baseOpts({ yFmt: v => nf(v, 2) + '%' }) });

  const n = D.dates.length, at = (s, b) => D.series[s][Math.max(0, n - 1 - b)];
  const mats = [['3M', '^IRX'], ['5Y', '^FVX'], ['10Y', '^TNX'], ['30Y', '^TYX']];
  draw('cCurve', { type: 'line', data: { labels: mats.map(m => m[0]), datasets: [
      lineDS('Hoy', mats.map(m => at(m[1], 0)), sc(0), { pointRadius: 4 }),
      lineDS('Hace 1 mes', mats.map(m => at(m[1], 21)), sc(1), { pointRadius: 4 }),
      lineDS('Hace 1 año', mats.map(m => at(m[1], 252)), sc(2), { pointRadius: 4 })] },
    options: baseOpts({ yFmt: v => nf(v, 2) + '%' }) });

  const slope = D.series['^TNX'].map((v, i) => v == null || D.series['^IRX'][i] == null ? null : (v - D.series['^IRX'][i]) * 100);
  draw('cSlope', { type: 'line', data: { labels: dates, datasets: [lineDS('10Y − 3M', slope, sc(0), { fill: { target: { value: 0 }, above: 'rgba(12,163,12,.10)', below: 'rgba(208,59,59,.14)' } })] },
    options: baseOpts({ yFmt: v => nf(v, 0) + ' pb', ref: 0, legend: false }) });

  if (D.fred.DFII10 && D.fred.T10YIE) {
    const f1 = D.fred.DFII10, f2 = D.fred.T10YIE, map2 = Object.fromEntries(f2.dates.map((d, i) => [d, f2.values[i]]));
    draw('cReal', { type: 'line', data: { labels: f1.dates.map(shortDate), datasets: [lineDS('Tasa real 10Y', f1.values, sc(0)), lineDS('Inflación implícita 10Y', f1.dates.map(d => map2[d] ?? null), sc(1))] },
      options: baseOpts({ yFmt: v => nf(v, 2) + '%' }) });
  } else {
    // sin FRED: rendimiento nominal 5Y vs 10Y como sustituto
    draw('cReal', { type: 'line', data: { labels: lab('1A'), datasets: [lineDS('Diferencial 30Y − 5Y', sl(D.series['^TYX'].map((v, i) => v == null || D.series['^FVX'][i] == null ? null : (v - D.series['^FVX'][i]) * 100), '1A'), sc(0))] },
      options: baseOpts({ yFmt: v => nf(v, 0) + ' pb', ref: 0, legend: false }) });
  }

  // crédito
  if (D.fredOk) {
    const f = D.fred.BAMLH0A0HYM2, g = D.fred.BAMLC0A0CM, s0 = rangeStart(S.credit, f.dates);
    const gm = g ? Object.fromEntries(g.dates.map((d, i) => [d, g.values[i]])) : {};
    const ds = [lineDS('High Yield OAS', f.values.slice(s0), sc(0))];
    if (g) ds.push(lineDS('Grado inversión OAS', f.dates.slice(s0).map(d => gm[d] ?? null), sc(1)));
    draw('cCredit', { type: 'line', data: { labels: f.dates.slice(s0).map(shortDate), datasets: ds }, options: baseOpts({ yFmt: v => nf(v, 2) + '%' }) });
  } else {
    let hp = rebase(sl(D.hyProxy, S.credit));
    if (isD(S.credit)) {
      const h = intra('HYG'), f = intra('IEF'), H0 = D.intraday.HYG, F0 = D.intraday.IEF, b = H0 && F0 ? H0.prev / F0.prev : null;
      hp = h.map((v, i) => v == null || f[i] == null || !b ? null : v / f[i] / b * 100);
    }
    draw('cCredit', { type: 'line', data: { labels: lab(S.credit), datasets: [lineDS('HYG / IEF', hp, sc(0))] },
      options: baseOpts({ yFmt: v => nf(v, 1), ref: 100, legend: false }) });
  }
  draw('cVix', { type: 'line', data: { labels: lab(S.vix), datasets: [lineDS('VIX', ser('^VIX', S.vix), sc(0)), lineDS('VIX 3M', ser('^VIX3M', S.vix), sc(1))] },
    options: baseOpts({ yFmt: v => nf(v, 0), ref: 20 }) });

  // energía vs tech
  const r = D.rolling[S.corrPair];
  draw('cCorr', { type: 'line', data: { labels: lab(S.corr), datasets: [
      lineDS('20 días', sl(r.c20, S.corr), sc(2), { borderWidth: 1.25 }), lineDS('60 días', sl(r.c60, S.corr), sc(0)), lineDS('120 días', sl(r.c120, S.corr), sc(1))] },
    options: baseOpts({ yFmt: v => nf(v, 1), tipFmt: v => nf(v, 2), ref: 0, min: -1, max: 1 }) });
  const en = [['XLE', 'Energía (XLE)'], ['XLK', 'Tecnología (XLK)'], ['SMH', 'Semis (SMH)'], ['CL=F', 'Petróleo WTI']];
  draw('cEnergy', { type: 'line', data: { labels: lab(S.energy), datasets: en.map(([s, nn], i) => lineDS(nn, reb(s, S.energy), sc(i))) },
    options: baseOpts({ yFmt: v => nf(v, 0), tipFmt: v => nf(v - 100, 1) + '%', ref: 100 }) });

  // sectores
  const secs = D.sectors.filter(s => D.quotes[s]).map(s => [q(s).name + ' (' + s + ')', q(s)[S.sector]]).sort((a, b) => b[1] - a[1]);
  const so = baseOpts({ yFmt: v => v, legend: false });
  so.indexAxis = 'y'; so.interaction = { mode: 'nearest', intersect: true, axis: 'y' };
  so.scales = { x: { grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--muted'), callback: v => nf(v * 100, 0) + '%', font: { size: 11 } } },
                y: { grid: { display: false }, border: { color: css('--axis') }, ticks: { color: css('--ink-2'), font: { size: 12 } } } };
  so.plugins.tooltip.callbacks = { label: c => ' ' + pct(c.parsed.x) };
  so.plugins.refLine = {};
  draw('cSector', { type: 'bar', data: { labels: secs.map(s => s[0]), datasets: [{ data: secs.map(s => s[1]),
      backgroundColor: secs.map(s => s[1] >= 0 ? css('--up-mark') : css('--down-mark')), borderRadius: 4, borderSkipped: false, barThickness: 16 }] }, options: so });

  // cartera
  const PP = PF(), portDS = [lineDS(PP.name, rebase(sl(PP.value, S.port)), sc(0)), lineDS('S&P 500', rebase(sl(D.series['^GSPC'], S.port)), sc(1))];
  if (PP !== PFS()[0]) portDS.push(lineDS('Mi cartera', rebase(sl(D.portfolio.value, S.port)), css('--muted'), { borderDash: [4, 4], borderWidth: 1.5 }));
  draw('cPort', { type: 'line', data: { labels: lab(S.port), datasets: portDS },
    options: baseOpts({ yFmt: v => nf(v, 0), tipFmt: v => nf(v - 100, 1) + '%', ref: 100 }) });

  // simulador
  if (simRes && simRes.A && simRes.B && $('#cSim')) {
    const sv = r => rebase(sl(r.V, S.simR));
    draw('cSim', { type: 'line', data: { labels: lab(S.simR), datasets: [lineDS('Simulada', sv(simRes.B), sc(0)), lineDS('Actual', sv(simRes.A), css('--muted'), { borderDash: [4, 4], borderWidth: 1.5 }), lineDS('S&P 500', rebase(sl(D.series['^GSPC'], S.simR)), sc(1))] },
      options: baseOpts({ yFmt: v => nf(v, 0), tipFmt: v => nf(v - 100, 1) + '%', ref: 100 }) });
  }

  // proyección
  if (D.portfolio.proj) {
    const H = +S.projH, ap = +S.projAporte, R = simulate(H, ap, +S.projMeta), scn = projScenarios(), k = S.projScen;
    const c = sc_(k), P = R.pct[k], col = i => P.map(r => r[i]);
    const band = (label, i, fill, a) => lineDS(label, col(i), c, { borderWidth: 0, pointHoverRadius: 0, fill: fill ? '-1' : false, backgroundColor: rgba(c, a) });
    const ds = [band('P90', 4, false), band('P10', 0, true, .12), band('P75', 3, false), band('P25', 1, true, .22),
      lineDS('Mediana ' + scn[k].name, col(2), c, { borderWidth: 2.5 })];
    Object.keys(scn).filter(x => x !== k).forEach(x => ds.push(lineDS('Mediana ' + scn[x].name, R.pct[x].map(r => r[2]), sc_(x), { borderDash: [5, 4], borderWidth: 1.5 })));
    ds.push(lineDS('Capital aportado', P.map((_, y) => D.portfolio.totals.mv + ap * 12 * y), css('--muted'), { borderDash: [2, 3], borderWidth: 1.5 }));
    const po = baseOpts({ yFmt: usdK, tipFmt: v => usd(v, 0), ref: +S.projMeta || null, xTicks: 11 });
    po.plugins.legend.labels.filter = it => !/^P\d/.test(it.text);
    if (S.projLog === '1') po.scales.y.type = 'logarithmic';
    // ocultar/mostrar líneas desde la leyenda (se recuerda entre actualizaciones)
    ds.forEach(d => { if (S.projHidden.has(d.label)) d.hidden = true; });
    po.plugins.legend.onClick = (e, item, legend) => {
      Chart.defaults.plugins.legend.onClick.call(legend, e, item, legend);
      const lbl = legend.chart.data.datasets[item.datasetIndex].label;
      legend.chart.isDatasetVisible(item.datasetIndex) ? S.projHidden.delete(lbl) : S.projHidden.add(lbl);
      applyProjZoom();
    };
    draw('cProj', { type: 'line', data: { labels: P.map((_, y) => y ? 'Año ' + y : 'Hoy'), datasets: ds }, options: po });
    applyProjZoom();
  }
}

// zoom de la proyección: tramo de años (eje X) y acercamiento vertical sobre las líneas visibles
function applyProjZoom() {
  const c = charts.cProj;
  if (!c) return;
  const n = c.data.labels.length - 1, x1 = Math.min(S.projX1 ?? n, n), x0 = Math.min(S.projX0, x1 - 1);
  let lo = Infinity, hi = -Infinity;
  c.data.datasets.forEach((d, i) => {
    if (!c.isDatasetVisible(i)) return;
    for (let k = x0; k <= x1; k++) { const v = d.data[k]; if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
  });
  const y = c.options.scales.y, f = S.projY / 100;
  if (isFinite(lo) && hi > lo) {
    if (S.projLog === '1') { lo = Math.max(lo, 1); y.min = lo * 0.92; y.max = lo * Math.pow(hi / lo, f) * 1.08; }
    else {
      const top = lo + (hi - lo) * f, pad = (top - lo) * 0.05, u = Math.pow(10, Math.floor(Math.log10(top - lo))) / 2;
      y.min = Math.max(0, Math.floor((lo - pad) / u) * u); y.max = Math.ceil((top + pad) / u) * u;
    }
  }
  c.options.scales.x.min = x0; c.options.scales.x.max = x1;
  c.update('none');
  const lab = $('#projXlab');
  if (lab) lab.textContent = `${x0 ? 'Año ' + x0 : 'Hoy'} – Año ${x1}`;
}

/* ------------------------------------------------------------------ events */
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id !== 'projY' && id !== 'projX0' && id !== 'projX1') return;
  const v = +e.target.value;
  if (id === 'projY') S.projY = v;
  if (id === 'projX0') { S.projX0 = v; const b = $('#projX1'); if (b && +b.value <= v) { b.value = v + 1; S.projX1 = v + 1; } }
  if (id === 'projX1') { S.projX1 = v; const a = $('#projX0'); if (a && +a.value >= v) { a.value = v - 1; S.projX0 = v - 1; } }
  applyProjZoom();
});
document.addEventListener('click', e => {
  const b = e.target.closest('.seg button');
  if (b) { S[b.parentElement.dataset.key] = b.dataset.v; render(); return; }
  const th = e.target.closest('#holdTbl th[data-sort]');
  if (th) { const k = th.dataset.sort; S.sort = { k, d: S.sort.k === k ? -S.sort.d : -1 }; render(); return; }
  const sd = e.target.closest('[data-simdel]');
  if (sd) { delete S.sim[sd.dataset.simdel]; render(); return; }
  const sa = e.target.closest('[data-simact]');
  if (sa) { const a = sa.dataset.simact;
    if (a === 'reset') simInit(true);
    else S.sim = a === 'equal' ? SimCore.equalize(S.sim) : a === 'small' ? SimCore.dropSmall(S.sim, 0.02) : SimCore.capWeight(S.sim, 0.10);
    render(); return; }
  if (e.target.id === 'simAddBtn') { const s = $('#simAddSel').value, v = Math.max(0, +$('#simAddAmt').value || 0); if (s && v) { S.sim[s] = (S.sim[s] || 0) + v; render(); } return; }
  if (e.target.id === 'lockBtn') { e.preventDefault(); PanelUnlock.forget(); return; }
  if (e.target.id === 'projReset') { S.projY = 100; S.projX0 = 0; S.projX1 = null; S.projLog = '0'; S.projHidden.clear(); render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'corrSel') { S.corrPair = e.target.value; render(); }
  if (e.target.id === 'compSel') { S.comp = e.target.value; render(); }
  if (e.target.classList.contains('simAmt')) { S.sim[e.target.dataset.sym] = Math.max(0, +e.target.value || 0); render(); }
  if (e.target.id === 'projAporte' || e.target.id === 'projMeta') {
    S[e.target.id] = String(Math.max(0, +e.target.value || 0));
    try { localStorage.setItem('panel-proj', JSON.stringify({ a: S.projAporte, m: S.projMeta })); } catch (_) {}
    render();
  }
});

function setTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  try { t ? localStorage.setItem('panel-theme', t) : localStorage.removeItem('panel-theme'); } catch (_) {}
  render(); tape();
}
$('#themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  setTheme(dark ? 'light' : 'dark');
});
try { const t = localStorage.getItem('panel-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

/* cinta en vivo (TradingView, streaming) */
function tape() {
  const box = $('#tape');
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  box.innerHTML = '<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>';
  const s = document.createElement('script');
  s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js'; s.async = true;
  s.text = JSON.stringify({ symbols: [
    { proName: 'FOREXCOM:SPXUSD', title: 'S&P 500' }, { proName: 'FOREXCOM:NSXUSD', title: 'Nasdaq 100' },
    { proName: 'TVC:USOIL', title: 'WTI' }, { proName: 'TVC:GOLD', title: 'Oro' }, { proName: 'BITSTAMP:BTCUSD', title: 'BTC' },
    { proName: 'AMEX:XLE', title: 'Energía' }, { proName: 'AMEX:XLK', title: 'Tecnología' },
    { proName: 'NASDAQ:NVDA', title: 'NVDA' }, { proName: 'NASDAQ:MSFT', title: 'MSFT' }, { proName: 'NASDAQ:AMD', title: 'AMD' },
    { proName: 'NASDAQ:AAPL', title: 'AAPL' }, { proName: 'NASDAQ:AMZN', title: 'AMZN' }, { proName: 'NASDAQ:GOOGL', title: 'GOOGL' }],
    showSymbolLogo: false, isTransparent: true, displayMode: 'compact', colorTheme: dark ? 'dark' : 'light', locale: 'es' });
  box.firstChild.appendChild(s);
}

/* recarga periódica de data.js */
function reload() {
  const s = document.createElement('script');
  s.src = 'data.js?t=' + Date.now();
  s.onload = async () => {
    s.remove();
    try { await PanelUnlock.ready(); } catch (err) { $('#app').innerHTML = `<div class="loading">${esc(err.message)}</div>`; schedule(); return; }
    render(); schedule();
  };
  s.onerror = () => { s.remove(); schedule(); };
  document.body.appendChild(s);
}
function schedule() {
  const sec = (window.PANEL_DATA && window.PANEL_DATA.refreshSeconds) || 120;
  nextAt = Date.now() + sec * 1000;
  setTimeout(reload, sec * 1000);
}
setInterval(updMeta, 1000);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) { render(); tape(); } });
tape();
reload();
